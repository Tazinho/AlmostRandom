{{ if and .Site.DisqusShortname (not (or .Site.Params.disable_comments .Params.disable_comments)) }}

<style>
  #comments {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid #ddd;
  }

  #comments [hidden] {
    display: none !important;
  }

  #comments .comments-heading {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    font-weight: 600;
  }

  #comments .comments-note {
    margin: 0.5rem 0 1rem;
    max-width: 42rem;
    font-size: 0.8em;
    line-height: 1.5;
  }

  #comments .comments-action {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    font: inherit;
    font-size: 0.9em;
    text-decoration: underline;
    cursor: pointer;
  }

  #comments .comments-action:disabled {
    opacity: 0.6;
    cursor: wait;
  }
</style>

<section id="comments"
         data-shortname="{{ .Site.DisqusShortname }}"
         data-url="{{ .Permalink }}">

  <h2 class="comments-heading">Comments</h2>

  <button id="load-comments"
          type="button"
          class="comments-action"
          aria-describedby="comments-notice">
    Agree and load comments
  </button>

  <p id="comments-notice" class="comments-note">
    Enables Disqus, which receives your IP address and page information
    and may use cookies for analytics and advertising.
    <a href="https://help.disqus.com/en/articles/1717103-disqus-privacy-policy"
       target="_blank"
       rel="noopener noreferrer">Privacy policy</a>.
  </p>

  <button id="disable-comments"
          type="button"
          class="comments-action"
          hidden>
    Disable comments and reload
  </button>

  <p id="comments-status" role="status"></p>
  <div id="disqus_thread"></div>

  <noscript>JavaScript is required to load comments.</noscript>
</section>

<script>
(function () {
  var section = document.getElementById('comments');
  var button = document.getElementById('load-comments');
  var disable = document.getElementById('disable-comments');
  var status = document.getElementById('comments-status');

  disable.addEventListener('click', function () {
    window.location.reload();
  });

  button.addEventListener('click', function () {
    if (button.disabled) return;

    button.disabled = true;
    disable.hidden = false;
    status.textContent = 'Loading comments…';

    window.disqus_config = function () {
      this.page.url = section.getAttribute('data-url');
    };

    var script = document.createElement('script');
    script.src = 'https://' +
      section.getAttribute('data-shortname').toLowerCase() +
      '.disqus.com/embed.js';
    script.async = true;
    script.setAttribute('data-timestamp', Date.now());

    script.onload = function () {
      button.hidden = true;
      status.textContent =
        'Disqus enabled. If comments do not appear, your browser may be blocking them.';
    };

    script.onerror = function () {
      script.remove();
      button.disabled = false;
      status.textContent =
        'Disqus could not load. You can retry or leave comments disabled.';
    };

    document.head.appendChild(script);
  });
})();
</script>

{{ end }}
